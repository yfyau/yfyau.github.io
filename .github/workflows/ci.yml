name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test and verify build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run lint, tests, build, and artifact checks
        run: npm run verify

      - name: Upload verified build output
        uses: actions/upload-artifact@c2acdedd35a8824a1552c7137f8c18288c3ea469
        with:
          name: verified-static-site-build
          path: build/
          if-no-files-found: error
          retention-days: 7
